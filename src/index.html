<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search Engin</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body class="bg-[#39297b] text-white">
    <h1 class="text-center mt-[100px] mx-auto mb-[50px] font-semibold text-3xl" >
        image search engine
    </h1>
    <form action="" id="search-form" class="w-[90%] m-auto max-w-150 h-20 bg-[#434989] flex items-center border rounded-sm">
        <input type="text" placeholder="search img here...." id="search-box" class="flex-1  h-full border-0 outline-none bg-transparent text-white text-lg px-8 py-0 placeholder:text-white">
        <button class="py-0 px-30 h-full bg-[#ff3929] text-white text-lg  outline-none border-0 border rounded-r-sm cursor-pointer ">Search</button>
    </form>
    <div class="" id="search-result"></div>
    <button id="show-more-btm" class="bg-[#ff3929] text-white border-0 outline-0 py-[10px] px-[20px] border rounded-md my-[10px] mx-auto mb-[100px] cursor-pointer hidden">Show More</button>


    
</body>
</html>
